[project]
name = "dvc-data-prep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
record-pq = "dvc_data_prep.record_pq:main"
read-pq = "dvc_data_prep.read_pq:main"
process-pq = "dvc_data_prep.process_pq:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
