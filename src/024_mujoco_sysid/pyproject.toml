[project]
name = "mujoco-sysid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.14"
dependencies = [
    "babyros>=0.1.10",
    "crs2r-image-processing",
    "dynamixel-sdk>=4.1.0",
    "mujoco[sysid]>=3.17.0",
    "opencv-python>=5.0.0.93",
    "pyzmq>=27.2.0",
]

[project.scripts]
sysid = "mujoco_sysid.sysid:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
crs2r-image-processing = { git = "https://github.com/noahjutz-2026-wise/crs2r-image-processing" }
