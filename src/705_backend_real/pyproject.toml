[project]
name = "backend-real"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.13"
dependencies = [
    "dynamixel-sdk>=4.1.0",
    "pyserial>=3.5",
    "pyzmq>=27.2.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["opencv-python>=5.0.0.93"]
container = ["opencv-python-headless>=5.0.0.93"]

[tool.uv]
conflicts = [[{ group = "dev" }, { group = "container" }]]

[project.scripts]
backend-real = "backend_real:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
