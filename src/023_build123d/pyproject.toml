[project]
name = "labyrinth-game-cad"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.14"
dependencies = [
    "build123d>=0.13.0",
    "coacd>=1.0.14",
    "trimesh>=5.1.1",
]

[project.scripts]
server = "labyrinth_game_cad.server:main"
export = "labyrinth_game_cad.export:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["yacv-server>=0.12.1"]
