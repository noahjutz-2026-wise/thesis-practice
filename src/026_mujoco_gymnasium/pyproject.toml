[project]
name = "mujoco-gymnasium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.13"
dependencies = [
    "brax>=0.14.2",
    "gymnasium>=1.2.2",
    "imageio>=2.38.1",
    "jax[cuda13]>=0.12.0.1",
    "mujoco>=3.17.0",
    "mujoco-mjx[warp]>=3.17.0",
    "opencv-python>=5.0.0.93",
]

[project.scripts]
mg = "mujoco_gymnasium.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
