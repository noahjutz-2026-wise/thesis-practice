[project]
name = "hello-rllib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[classic-control]>=1.2.2",
    "mujoco-gymnasium",
    "pillow>=12.3.0",
    "ray[default,rllib]>=2.59.0",
    "real-gymnasium",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]

[project.scripts]
train-mujoco = "hello_rllib.main:train_mujoco"
eval-mujoco = "hello_rllib.main:eval_mujoco"
train-real = "hello_rllib.main:train_real"
eval-real = "hello_rllib.main:eval_real"

train-m = "hello_rllib.train_mujoco:main" # Deprecated
eval-m = "hello_rllib.eval_mujoco:main"   # Deprecated

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
mujoco-gymnasium = { path = "../026_mujoco_gymnasium", editable = true }
real-gymnasium = { path = "../029_real_gymnasium", editable = true }
