[project]
name = "hello-rllib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Noah Jutz", email = "git@noahjutz.anonaddy.com" }]
requires-python = ">=3.13"
dependencies = [
    "gymnasium[classic-control]>=1.2.2",
    "mujoco-gymnasium",
    "pillow>=12.3.0",
    "ray[default,rllib]>=2.59.0",
    "torch>=2.14.1",
]

[project.scripts]
hello-rllib = "hello_rllib.main:main"
train-m = "hello_rllib.train_mujoco:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
mujoco-gymnasium = { path = "../026_mujoco_gymnasium", editable = true }
